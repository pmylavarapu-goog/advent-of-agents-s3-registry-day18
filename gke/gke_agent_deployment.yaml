apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-a2a-agent
  labels:
    # GKE cluster runtime controller detects this label and automatically
    # registers the workload into Agent Registry
    registry.gke.io/functional-type: "AGENT"
  annotations:
    # A2A protocol metadata annotation for automated Agent Card & skill discovery
    a2a-protocol.org/agent-card: |
      card:
        endpoint: /.well-known/agent-card.json
        protocol: HTTP
        port: 8080
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-a2a-agent
  template:
    metadata:
      labels:
        app: inventory-a2a-agent
    spec:
      containers:
      - name: server
        image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/agents/inventory-agent:1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-a2a-agent-service
  labels:
    app: inventory-a2a-agent
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: inventory-a2a-agent
